name: Feature proposal
description: Propose a scoped improvement or change to a planned milestone.
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, do not use public issues; follow SECURITY.md."
  - type: textarea
    id: goal
    attributes:
      label: User problem and desired outcome
      description: Explain the benefit, without including confidential network details.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed behavior and boundaries
      description: Identify affected monitoring/transport/intelligence/security areas.
    validations:
      required: true
  - type: input
    id: milestone
    attributes:
      label: Related issue or milestone
      placeholder: "M0.8, M6.10, or link to an existing issue"
  - type: textarea
    id: tests
    attributes:
      label: Proposed acceptance and verification
      description: What can be checked? Distinguish future tests from existing tests.
